<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151B23"/>
      <stop offset="50%" stop-color="#111720"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C66A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
    <linearGradient id="steam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8C66A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background Plate -->
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="130" fill="#1C2530" stroke="#293241" stroke-width="2"/>

  <!-- Food Cloche / Dish Art -->
  <g transform="translate(200, 145)">
    <!-- Plate base -->
    <ellipse cx="0" cy="35" rx="85" ry="14" fill="#0B0F14" stroke="#293241" stroke-width="2"/>
    <ellipse cx="0" cy="32" rx="75" ry="10" fill="url(#gold)"/>

    <!-- Cloche dome -->
    <path d="M -60 25 A 60 50 0 0 1 60 25 Z" fill="#1C2530" stroke="url(#gold)" stroke-width="3"/>

    <!-- Handle -->
    <circle cx="0" cy="-28" r="9" fill="url(#gold)"/>
    <rect x="-3" y="-20" width="6" height="8" fill="url(#gold)"/>

    <!-- Steam swirls -->
    <path d="M -25 -32 C -30 -45 -15 -55 -22 -68" fill="none" stroke="url(#steam)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 -38 C -5 -50 10 -60 5 -75" fill="none" stroke="url(#steam)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 25 -32 C 20 -45 35 -55 28 -68" fill="none" stroke="url(#steam)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Label -->
  <text x="200" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#D4AF37" letter-spacing="3">FOODORA SPECIALTY</text>
  <text x="200" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#94A3B8">Authentic Ceylon Recipe</text>
</svg>
